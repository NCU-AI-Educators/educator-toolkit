<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP: Allow local scripts/styles and unsafe-inline for convenience in this preview -->
    
    <title>Hawk Markdown Reader</title>
    <style>
        /* Injected CSS Content */
        /* {{ CSS_BLOCK }} */
    </style>
</head>
<body>
    <div class="reader-container" id="content-area">
        {{ MARKDOWN_CONTENT }}
    </div>

    <!-- Auto-Scroll Script -->
    <script>
        // Auto-Scroll Logic (Teleprompter Mode)
        let isAutoScrolling = false;
        let scrollInterval;
        const SCROLL_SPEED = 1;
        const SCROLL_INTERVAL = 20;

        function toggleAutoScroll() {
            if (isAutoScrolling) {
                clearInterval(scrollInterval);
                isAutoScrolling = false;
                showToast("⏸ Paused");
            } else {
                scrollInterval = setInterval(() => {
                    if (window.scrollY + window.innerHeight >= document.body.scrollHeight) {
                        clearInterval(scrollInterval);
                        isAutoScrolling = false;
                        showToast("⏹ Finished");
                    } else {
                        window.scrollBy(0, SCROLL_SPEED);
                    }
                }, SCROLL_INTERVAL);
                isAutoScrolling = true;
                showToast("▶️ Auto-Scrolling");
            }
        }

        function showToast(msg) {
            let toast = document.getElementById('scroll-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'scroll-toast';
                toast.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0,0,0,0.7);
                    color: white;
                    padding: 15px 30px;
                    border-radius: 30px;
                    font-size: 24px;
                    z-index: 9999;
                    pointer-events: none;
                    transition: opacity 0.5s;
                `;
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            toast.style.opacity = '1';

            if (toast.timeout) clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => {
                toast.style.opacity = '0';
            }, 1000);
        }

        // Global Key Listener
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleAutoScroll();
            }
        });

        // PostMessage Listener
        window.addEventListener('message', (event) => {
            if (event.data && event.data.action === 'toggleScroll') {
                toggleAutoScroll();
            }
        });
    </script>
</body>
</html>
